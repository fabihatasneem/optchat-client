# OptChat for iPhone and iPad: GPUI (zed-industries/zed gpui-ios-platform, zed#63068, pinned in vendor/zed by
# build.sh) + the engine client. Built by build.sh (called from OptChat.xcodeproj's script phase).
[workspace]

[package]
name = "optchat-ios"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "optchat-ios"
path = "src/main.rs"

[dependencies]
gpui = { path = "../vendor/zed/crates/gpui" }
gpui_platform = { path = "../vendor/zed/crates/gpui_platform" }
gpui_ios = { path = "../vendor/zed/crates/gpui_ios" }
serde_json = "1"
unicode-segmentation = "1.10"
objc2 = "0.6"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "native-tls"] }
native-tls = "0.2"
url = "2"
base64 = "0.22"
mach2 = "0.6"

# the zed workspace's patches that GPUI's dependency graph needs (async-task/async-process are used by gpui)
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
panic = "abort"
