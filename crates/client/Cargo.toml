[package]
name = "optchat-client"
edition.workspace = true
version.workspace = true

# The engine client without UI (shared by the macOS and iOS apps): connections (one socket per engine), the app
# state and its reducer (a GPUI entity, no views), rpc, reconnect, tokens (Keychain), dictation audio.
[dependencies]
gpui.workspace = true
optchat-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
base64.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
cpal = "0.16"
security-framework = "3"
libc = "0.2"
