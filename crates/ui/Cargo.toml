[package]
name = "optchat-ui"
edition.workspace = true
version.workspace = true
build = "build.rs"

# OptChat's UI on GPUI (macOS and iOS): theme, feed and markdown, panels, composer, status bar, workspaces panel,
# kit components; icons and fonts bundled (assets/). Platform-only code is cfg-gated (AppKit test input on macOS).
[dependencies]
gpui.workspace = true
optchat-proto = { path = "../proto" }
optchat-client = { path = "../client" }
optchat-theme = { path = "../theme" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
chrono.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
smallvec = "1"
libc = "0.2"
unicode-segmentation = "1"
base64.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
