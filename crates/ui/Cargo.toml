[package]
name = "optchat-ui"
edition.workspace = true
version.workspace = true
build = "build.rs"

# OptChat's UI on GPUI (macOS and iOS): theme, feed and markdown, panels, composer, status bar, workspaces panel,
# kit components; icons and fonts bundled (assets/). OS features come through optchat-platform; the only cfg-gated
# code is the AppKit headless test input (macOS), with no-op stubs elsewhere.
[dependencies]
gpui.workspace = true
optchat-proto.workspace = true
optchat-platform.workspace = true
optchat-client.workspace = true
optchat-theme.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
chrono.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
smallvec = "1"
unicode-segmentation = "1"
base64.workspace = true
uuid.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
