[package]
name = "optchat-platform"
edition.workspace = true
version.workspace = true
description = "The Platform trait: the shared crates' only door to OS features (token store, process stats, QR scan, …). Shells implement it."

# The shared crates (client, ui) depend on this crate WITHOUT features. A shell may enable a ready-made
# implementation for its OS (e.g. `apple-keychain`); nothing OS-specific is compiled otherwise.
[features]
apple-keychain = ["dep:security-framework"]

[dependencies]
gpui.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3", optional = true }
