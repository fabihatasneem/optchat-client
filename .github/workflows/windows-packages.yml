name: Windows development packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-packages.yml'
      - '.cargo/**'
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'assets/**'
      - 'patches/zed/**'
      - 'tools/zed-vendor.ps1'
      - 'shells/windows/**'
      - 'vendor/zed'
      - 'third_party/native-tls/**'

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            vs_arch: amd64
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            vs_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
      PACKAGE_TARGET: ${{ matrix.target }}
      VS_ARCHITECTURE: ${{ matrix.vs_arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build native development packages and test shell hooks
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne $env:PACKAGE_ARCHITECTURE) { throw 'Runner must match the native target architecture.' }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable Git long paths.' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio is missing.' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch $env:VS_ARCHITECTURE -HostArch $env:VS_ARCHITECTURE -SkipAutomaticLocation
          ./shells/windows/release/test-packaging.ps1
          ./shells/windows/release/test-vendor.ps1
          ./shells/windows/release/build.ps1 -Architecture $env:PACKAGE_ARCHITECTURE
          cargo test --locked --release -p optchat-windows --target $env:PACKAGE_TARGET --target-dir target/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows shell tests failed.' }
          Get-ChildItem "dist-dev/windows-$env:PACKAGE_ARCHITECTURE" -File |
            Where-Object Extension -in @('.zip', '.msix') |
            ForEach-Object { ./shells/windows/release/check-package.ps1 -Package $_.FullName -Architecture $env:PACKAGE_ARCHITECTURE }

      - name: Save development packages and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ matrix.architecture }}
          path: |
            dist-dev/windows-${{ matrix.architecture }}/
            build/windows/${{ matrix.architecture }}/**/imports.txt
          if-no-files-found: warn
          retention-days: 14
